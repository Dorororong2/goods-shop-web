<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>굿즈샵 — 내 결제 내역</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<div id="header"></div>

<main class="container">
  <h1 class="page-title">내 결제 내역</h1>
  <p class="page-desc">내가 주문한 내역만 보입니다.</p>

  <div id="content">
    <div class="loading"><div class="spinner"></div>불러오는 중…</div>
  </div>
</main>

<script type="module">
import { supabase, formatWon, formatDate, escapeHtml } from './assets/js/supabase.js';
import { renderHeader, requireLogin } from './assets/js/auth.js';

renderHeader('orders.html');

const content = document.getElementById('content');

const user = await requireLogin();
if (!user) throw new Error('redirecting');

// user_id 조건을 따로 걸지 않아도 됩니다.
// 데이터베이스의 RLS 규칙이 "본인 주문만" 자동으로 걸러줍니다.
const { data: orders, error } = await supabase
  .from('orders')
  .select('order_code, product_name, quantity, amount, status, method, approved_at, created_at, fail_reason')
  .order('created_at', { ascending: false });

if (error) {
  content.innerHTML = `<div class="alert alert-error">${escapeHtml(error.message)}</div>`;
} else if (!orders.length) {
  content.innerHTML = `
    <div class="empty">
      <span class="emoji">🧾</span>
      아직 결제 내역이 없습니다.
      <div style="margin-top:16px"><a class="btn" href="index.html">굿즈 보러 가기</a></div>
    </div>`;
} else {
  const paid = orders.filter((o) => o.status === 'DONE');
  const total = paid.reduce((sum, o) => sum + o.amount, 0);

  content.innerHTML = `
    <div class="card stats">
      <div>
        <div class="stat-label">결제 완료</div>
        <div class="stat-value">${paid.length}건</div>
      </div>
      <div>
        <div class="stat-label">총 결제금액</div>
        <div class="stat-value highlight">${formatWon(total)}</div>
      </div>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>상품</th>
            <th>주문일시</th>
            <th class="num">수량</th>
            <th class="num">금액</th>
            <th>결제수단</th>
            <th>상태</th>
          </tr>
        </thead>
        <tbody>
          ${orders.map(renderRow).join('')}
        </tbody>
      </table>
    </div>`;
}

function renderRow(o) {
  return `
    <tr>
      <td class="cell-title">
        ${escapeHtml(o.product_name)}
        <div class="order-code">${escapeHtml(o.order_code)}</div>
      </td>
      <td data-label="주문일시">${formatDate(o.created_at)}</td>
      <td data-label="수량" class="num">${o.quantity}개</td>
      <td data-label="금액" class="num">${formatWon(o.amount)}</td>
      <td data-label="결제수단">${escapeHtml(o.method ?? '-')}</td>
      <td data-label="상태">
        <div>
          <span class="badge badge-${o.status}">${statusLabel(o.status)}</span>
          ${o.status === 'FAILED' && o.fail_reason
            ? `<div class="fail-reason">${escapeHtml(o.fail_reason)}</div>`
            : ''}
        </div>
      </td>
    </tr>`;
}

function statusLabel(status) {
  return {
    DONE: '결제완료',
    PENDING: '결제대기',
    FAILED: '실패',
    CANCELED: '취소됨',
  }[status] ?? status;
}
</script>

</body>
</html>
